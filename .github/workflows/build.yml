name: Test and build desktop apps
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ffr-helper-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Fetch verified native dependency
        if: runner.os == 'Windows'
        run: python tools/fetch_native_dependencies.py
      - name: Install existing codec dependency for native recovery fixture validation
        if: runner.os == 'Windows'
        run: python -m pip install pycryptodome==4.2.0
      - name: Configure portable capture tests
        if: runner.os != 'Windows'
        run: cmake -S native -B local/native-ci
      - name: Configure Windows observer and isolated fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ffrMinHook = (Resolve-Path 'local/native-deps/minhook-1.3.4').Path
          cmake -S native -B local/native-ci -A x64 -DFFR_BUILD_NATIVE_OBSERVER=ON -DFFR_BUILD_ABORT_TRIAL=ON "-DMINHOOK_SOURCE_DIR=$ffrMinHook"
      - name: Build native capture
        run: cmake --build local/native-ci --config Release
      - name: Test detached data, real fixture detour and profile refusal
        run: ctest --test-dir local/native-ci -C Release --output-on-failure
      - name: Package development observer without test DLLs or enabled marker
        if: runner.os == 'Windows'
        run: python tools/package_native_observer.py --dll local/native-ci/Release/main.dll
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: FFR-Helper-Native-Observer-Development
          path: dist/native-packages/*
          if-no-files-found: error
          retention-days: 30
      - name: Package separate disabled opening-abort trial
        if: runner.os == 'Windows'
        run: python tools/package_abort_trial.py --dll local/native-ci/Release/FFRHelperBattlePractice.dll
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: FFR-Helper-Opening-Abort-Trial-Development
          path: dist/abort-trial-packages/*
          if-no-files-found: error
          retention-days: 30
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: ubuntu-22.04
            name: Linux
          - os: macos-15-intel
            name: macOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt lupa==2.8
      - name: Install Linux desktop runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - name: Test save editing, progression, checkpoints and adapter lease
        run: python -m unittest discover -s tests -v
      - name: Build standalone application
        run: python tools/build.py
      - name: Smoke-test packaged application
        shell: python
        run: |
          import pathlib, subprocess, sys
          executable = pathlib.Path('dist/FFR Helper.exe' if sys.platform == 'win32' else 'dist/FFR Helper.app/Contents/MacOS/FFR Helper' if sys.platform == 'darwin' else 'dist/FFR Helper').resolve()
          subprocess.run([str(executable), '--self-test'], check=True, timeout=30)
      - name: Package application
        run: python tools/package.py
      - uses: actions/upload-artifact@v7
        with:
          name: FFR-Helper-${{ matrix.name }}
          path: dist/packages/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
