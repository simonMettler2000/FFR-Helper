[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ffr-helper"
version = "0.1.0"
description = "Offline Final Fantasy Resonance practice saves and route planning"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "cryptography>=44,<51"]

[project.scripts]
ffr-helper = "ffr_helper.app:main"
ffr-helper-cli = "ffr_helper.cli:main"

[tool.setuptools.package-data]
ffr_helper = ["data/*.json"]

